<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>You Found It</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<!-- =================================================
     SECRET PAGE AUDIO
================================================== -->

<audio
    id="underwaterAudio"
    src="music/underwater.mp3"
    loop
    preload="auto">
</audio>


<audio
    id="specialAudio"
    src="music/special-song.mp3"
    preload="auto">
</audio>

<body class="secret-page">
    <div class="page-fade"></div>


    <!-- =====================================================
         SECRET PAGE
    ====================================================== -->

    <main class="secret-main">


        <!-- =================================================
             BUBBLES
        ================================================== -->

        <div class="bubbles">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- =================================================
             SECRET IMAGE
        ================================================== -->

        <img
            src="pictures/secret-image.jpg"
            alt="A mysterious image"
            class="secret-image"
         id="secretImage"
        >


        <!-- =================================================
             SECRET DIALOGUE
        ================================================== -->

        <section class="secret-content">

            <h1 id="dialogueTitle">
                You Found Me!
            </h1>


            <p id="dialogueText">

            </p>

            <div id="dialogueIndicator" class="dialogue-indicator">

            </div>


            <div class="dialogue-controls">

    <button
        id="dialogueButton"
        class="secret-return"
    >
        Continue
    </button>

            <div
                id="dialogueChoices"
                class="dialogue-choices"
            >
            </div>

    <a
        href="index.html"
        class="resurface-button"
        aria-label="Resurface Early?"
    >
        <img
            src="pictures/lantern.png"
            alt=""
        >

        <span class="resurface-tooltip">
            Resurface Early?
        </span>
    </a>

</div>

        </section>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

</html>
